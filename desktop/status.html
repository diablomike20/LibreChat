<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
  <title>LibreChat Desktop — indítás</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { background:#18181b; color:#f4f4f5; height:100vh; display:grid; place-items:center; margin:0; }
    main { text-align:center; max-width:34rem; padding:2rem; }
    h1 { letter-spacing:-.04em; font-size:2.3rem; }
    p { color:#a1a1aa; line-height:1.65; }
    .spinner { width:44px; height:44px; margin:1.5rem auto; border:3px solid #3f3f46; border-top-color:#d4d4d8; border-radius:50%; animation:spin 1.1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce) { .spinner { animation:none; } }
  </style>
</head>
<body>
<main>
  <h1>LibreChat Desktop</h1>
  <div class="spinner" aria-label="Indítás folyamatban"></div>
  <p>A helyi adatbázis és a LibreChat elindul. Az első indításkor a MongoDB hivatalos binárisának letöltése is szükséges lehet.</p>
  <p>Dockerre nincs szükség.</p>
</main>
</body>
</html>
