name: LibreChat Desktop Windows smoke

on:
  push:
    branches:
      - feature/windows-desktop-dockerless-poc
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Match LibreChat npm
        run: |
          npm install --global npm@11.16.0
          node --version
          npm --version
      - name: Parse PowerShell installers without running them
        run: |
          $files = @(
            'desktop/windows/Install.ps1',
            'desktop/windows/QuickInstall.ps1',
            'desktop/windows/Diagnosztika.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax error: $file"
            }
          }
      - name: Test desktop control logic
        run: node --test desktop/runtime.test.cjs
      - name: Install LibreChat dependencies
        run: npm ci --no-audit --no-fund
      - name: Build LibreChat UI
        run: npm run frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Install Electron
        run: npm install --no-audit --no-fund --prefix desktop
      - name: Verify Windows build artifacts
        run: |
          if (-not (Test-Path 'client/dist/index.html')) { throw 'LibreChat frontend dist missing' }
          if (-not (Test-Path 'desktop/node_modules/electron/dist/electron.exe')) {
            throw 'Windows Electron runtime missing'
          }
          Write-Host 'Windows dependency and build smoke passed; GUI+Mongo startup not yet exercised.'
