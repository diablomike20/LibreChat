name: LibreChat Desktop Windows smoke

on:
  push:
    branches:
      - feature/windows-desktop-dockerless-poc
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24 (repo packageManager pins npm 11.13.0)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Match LibreChat npm
        run: |
          npm install --global npm@11.13.0
          node --version
          npm --version
      - name: Parse PowerShell installers without running them
        run: |
          $files = @(
            'desktop/windows/Install.ps1',
            'desktop/windows/QuickInstall.ps1',
            'desktop/windows/Diagnosztika.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax error: $file"
            }
          }
      - name: Test desktop control logic
        run: node --test desktop/runtime.test.cjs
      - name: Install LibreChat dependencies
        run: npm ci --no-audit --no-fund
      - name: Build LibreChat UI
        run: npm run frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Install Electron with explicit dev dependencies
        run: npm install --no-audit --no-fund --include=dev --ignore-scripts=false --workspaces=false --prefix desktop
      - name: Verify Windows build artifacts and Electron location
        run: |
          if (-not (Test-Path 'client/dist/index.html')) { throw 'LibreChat frontend dist missing' }
          $pkgPaths = @('desktop/node_modules/electron', 'node_modules/electron')
          $foundPackage = $false
          $foundExecutable = $false
          foreach ($pkg in $pkgPaths) {
            $installed = Test-Path (Join-Path $pkg 'package.json')
            $exe = Test-Path (Join-Path $pkg 'dist/electron.exe')
            Write-Host "Electron candidate: $pkg, package=$installed, exe=$exe"
            if ($installed) { $foundPackage = $true }
            if ($exe) { $foundExecutable = $true }
          }
          Write-Host ('npm omit: ' + (npm config get omit))
          Write-Host ('npm ignore-scripts: ' + (npm config get ignore-scripts))
          if (-not $foundPackage) { throw 'Electron npm package missing' }
          if (-not $foundExecutable) {
            $install = $pkgPaths | ForEach-Object { Join-Path $_ 'install.js' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $install) { throw 'Electron install.js missing' }
            Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
            node $install
            if ($LASTEXITCODE -ne 0) { throw 'Electron binary download failed' }
            foreach ($pkg in $pkgPaths) {
              if (Test-Path (Join-Path $pkg 'dist/electron.exe')) { $foundExecutable = $true }
            }
          }
          if (-not $foundExecutable) { throw 'Windows Electron executable is still missing' }
          Write-Host 'Windows dependencies and Electron binary verified.'
      - name: Prepare isolated LibreChat Desktop runtime
        run: |
          $ciLocal = Join-Path $env:RUNNER_TEMP 'LibreChatDesktop-E2E'
          $runtimeNode = Join-Path $ciLocal 'LibreChatDesktop/runtime/node'
          New-Item -ItemType Directory -Force -Path $runtimeNode | Out-Null
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath (Join-Path $runtimeNode 'node.exe') -Force
          "LOCALAPPDATA=$ciLocal" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item '.env.example' '.env' -Force
          $envPath = (Resolve-Path '.env').Path
          $text = [IO.File]::ReadAllText($envPath)
          $vals = @{
            'HOST'='127.0.0.1'; 'DOMAIN_CLIENT'='http://127.0.0.1:3080';
            'DOMAIN_SERVER'='http://127.0.0.1:3080'; 'SEARCH'='false';
            'ALLOW_REGISTRATION'='true'; 'ALLOW_EMAIL_LOGIN'='true';
            'SESSION_COOKIE_SECURE'='false';
            'JWT_SECRET'=[guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N');
            'JWT_REFRESH_SECRET'=[guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N');
            'CREDS_KEY'=[guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N');
            'CREDS_IV'=[guid]::NewGuid().ToString('N')
          }
          foreach ($key in $vals.Keys) {
            $line = '(?m)^' + [regex]::Escape($key) + '=.*$'

            $replacement = $key + '=' + $vals[$key]
            if ([regex]::IsMatch($text, $line)) { $text = [regex]::Replace($text, $line, $replacement) }
            else { $text += "`n$replacement`n" }
          }
          [IO.File]::WriteAllText($envPath, $text, ([System.Text.UTF8Encoding]::new($false)))
      - name: Launch actual Electron + LibreChat backend and wait for readiness
        timeout-minutes: 6
        run: |
          $electron = (Resolve-Path 'desktop/node_modules/electron/dist/electron.exe').Path
          $work = (Resolve-Path 'desktop').Path
          $appData = Join-Path $env:LOCALAPPDATA 'LibreChatDesktop/data'
          $logDir = Join-Path $appData 'logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $proc = Start-Process -FilePath $electron -ArgumentList @('.') -WorkingDirectory $work -PassThru
          $deadline = (Get-Date).AddMinutes(4)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            if ($proc.HasExited) {
              $desktopLog = Join-Path $logDir 'desktop.log'
              $backendLog = Join-Path $logDir 'backend.log'
              if (Test-Path $desktopLog) { Get-Content $desktopLog -Tail 100 }
              if (Test-Path $backendLog) { Get-Content $backendLog -Tail 160 }
              throw "Electron exited before LibreChat became ready (exit $($proc.ExitCode))."
            }
            $desktopLog = Join-Path $logDir 'desktop.log'
            if ((Test-Path $desktopLog) -and (Select-String -Path $desktopLog -Pattern 'Kész' -Quiet)) {
              $ready = $true
              break
            }
            $backendLog = Join-Path $logDir 'backend.log'
            if ((Test-Path $backendLog) -and (Select-String -Path $backendLog -Pattern 'START ERROR|Error:|ERR_' -Quiet)) {
              Get-Content $backendLog -Tail 160
              throw 'LibreChat backend logged a startup error.'
            }
          }
          if (-not $ready) {
            if (Test-Path (Join-Path $logDir 'desktop.log')) { Get-Content (Join-Path $logDir 'desktop.log') -Tail 100 }
            if (Test-Path (Join-Path $logDir 'backend.log')) { Get-Content (Join-Path $logDir 'backend.log') -Tail 160 }
            throw 'Electron launched but LibreChat did not reach the ready state within four minutes.'
          }
          Write-Host 'PASS: real Electron window started and LibreChat /readyz was reached.'
          $null = $proc.CloseMainWindow()
          if (-not $proc.WaitForExit(30000)) {
            Stop-Process -Id $proc.Id -Force
            throw 'Electron did not shut down cleanly after the E2E check.'
          }
      - name: MongoDB binary launch and persistence across restart
        run: node --test desktop/mongo.integration.test.cjs
